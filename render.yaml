# Render.com blueprint — deploys the Flight Path Tracker as a web service.
# In the Render dashboard: New -> Blueprint -> select this repository.
#
# Single worker on purpose: the app keeps flight/playback state server-side
# in one session (single-user demo). Threads provide request concurrency.
services:
  - type: web
    name: flight-path-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install .
    startCommand: python -m gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT flighttracker.wsgi:server
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
